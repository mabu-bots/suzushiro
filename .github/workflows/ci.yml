# ==========================================
# ✅ CI ワークフロー
# ==========================================
name: CI

# push は main のみに絞り、PR ブランチの push と pull_request による
# 二重起動を防ぐ。ドキュメントのみの変更では起動しない。
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🧪 構文チェックと統合テスト
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high
